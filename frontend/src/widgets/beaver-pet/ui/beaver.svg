<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -20 490 435" aria-hidden="true">
  <defs>
    <radialGradient id="fur" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#C17C45"/>
      <stop offset="0.6" stop-color="#AE6A38"/>
      <stop offset="1" stop-color="#93552C"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4874F"/>
      <stop offset="1" stop-color="#9D5C31"/>
    </linearGradient>
    <radialGradient id="tail-grad" cx="30%" cy="15%" r="105%">
      <stop stop-color="#76513F"/>
      <stop offset="1" stop-color="#3F281F"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="20%" r="95%">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F3E6D8"/>
    </radialGradient>
    <linearGradient id="nose-grad" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#4A3129"/>
      <stop offset="1" stop-color="#1E1513"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE4D6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tail-clip">
      <path d="M282 343 C299 320 316 303 336 292 C353 282 376 282 393 293 C417 310 425 332 417 358 C411 385 398 413 379 436 C353 464 319 477 279 480 L252 446 Z"/>
    </clipPath>
    <clipPath id="mouth-open-clip"><path d="M147 234 Q187.5 242 228 234 C232 268 214 290 187.5 290 C161 290 143 268 147 234 Z"/></clipPath>
    <clipPath id="mouth-o-clip"><path d="M187.5 224 C200 224 204 236 204 246 C204 258 197 266 187.5 266 C178 266 171 258 171 246 C171 236 175 224 187.5 224 Z"/></clipPath>
    <clipPath id="eye-clip-left"><ellipse cx="110" cy="159" rx="21.5" ry="24"/></clipPath>
    <clipPath id="eye-clip-right"><ellipse cx="263" cy="159" rx="21.5" ry="24"/></clipPath>
    <clipPath id="body-clip">
      <path d="M110 275 C86 300 70 338 68 380 C66 425 76 462 97 485 C146 480 228 480 277 485 C298 462 308 425 306 380 C304 338 288 300 264 275 Z"/>
    </clipPath>
    <linearGradient id="cloth-shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="0.3" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="head-clip"><path d="M86 87 C109 47 147 32 188 32 C225 29 260 39 285 57 C315 75 333 116 342 169 C352 174 360 184 362 193 C365 205 353 206 343 200 C355 219 355 232 347 236 C342 238 338 231 335 226 C336 251 315 270 279 282 C256 293 230 296 190 296 C139 296 99 290 77 283 C47 273 34 258 33 230 C26 242 17 239 19 224 C19 217 22 208 30 201 C19 209 11 202 17 191 C22 181 30 177 43 170 C49 133 60 106 86 87 Z"/></clipPath>
    <clipPath id="arm-clip-left"><path d="M98 312 C80 330 58 360 44 386 C34 404 38 421 54 425 C68 428 80 420 86 406 C94 386 106 362 116 336 C114 326 108 316 98 312 Z"/></clipPath>
    <clipPath id="arm-clip-right"><path d="M276 312 C294 330 316 360 330 386 C340 404 336 421 320 425 C306 428 294 420 288 406 C280 386 268 362 258 336 C260 326 266 316 276 312 Z"/></clipPath>
    <!-- Outlines that outfit items redraw on top of themselves via <use>. -->
    <path id="body-line" d="M110 275 C86 300 70 338 68 380 C66 425 76 462 97 485 C146 480 228 480 277 485 C298 462 308 425 306 380 C304 338 288 300 264 275 Z" fill="none" stroke="#241510" stroke-width="5.5" stroke-linejoin="round"/>
    <path id="arm-line-left" d="M98 314 C80 330 58 360 44 386 C34 404 38 421 54 425 C68 428 80 420 86 406 C94 386 106 362 114 340" fill="none" stroke="#241510" stroke-width="5.5" stroke-linecap="round"/>
    <path id="arm-line-right" d="M276 314 C294 330 316 360 330 386 C340 404 336 421 320 425 C306 428 294 420 288 406 C280 386 268 362 260 340" fill="none" stroke="#241510" stroke-width="5.5" stroke-linecap="round"/>
  </defs>


  <g id="slot-background"></g>
  <g id="beaver" transform="translate(39 6) scale(0.73)"><g id="slot-scene"></g><g id="beaver-inner">
    <!-- Soft ground shadow. -->
    <ellipse id="shadow" cx="190" cy="524" rx="150" ry="11" fill="#2A1A12" opacity="0.18"/>

    <!-- Paddle tail with a soft scale texture, behind the body. -->
    <g id="tail">
      <path d="M282 343 C299 320 316 303 336 292 C353 282 376 282 393 293 C417 310 425 332 417 358 C411 385 398 413 379 436 C353 464 319 477 279 480 L252 446 Z" fill="url(#tail-grad)"/>
      <g clip-path="url(#tail-clip)" fill="none" stroke="#2A1A12" stroke-width="3" stroke-linecap="round" opacity="0.35">
        <path d="M270 380 L360 300 M280 420 L400 315 M285 465 L420 350 M320 475 L425 400"/>
        <path d="M300 320 L420 420 M290 360 L400 455 M285 400 L360 470"/>
      </g>
      <path d="M318 312 C340 296 368 293 388 306" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.18"/>
      <path d="M282 343 C299 320 316 303 336 292 C353 282 376 282 393 293 C417 310 425 332 417 358 C411 385 398 413 379 436 C353 464 319 477 279 480" fill="none" stroke="#241510" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Feet stay planted while the torso breathes above them. -->
    <g id="feet">
      <path id="foot-left" d="M99 483 C79 483 66 490 63 502 C58 515 69 524 89 526 L136 525 C155 526 164 517 163 505 L163 483 C148 489 126 486 117 485" fill="url(#fur)" stroke="#241510" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path id="foot-right" d="M275 483 C295 483 308 490 311 502 C316 515 305 524 285 526 L238 525 C219 526 210 517 211 505 L211 483 C226 489 248 486 257 485" fill="url(#fur)" stroke="#241510" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="none" stroke="#241510" stroke-width="4.5" stroke-linecap="round">
        <path d="M88 502 Q82 512 87 521 M109 501 Q103 511 108 521"/>
        <path d="M286 502 Q292 512 287 521 M265 501 Q271 511 266 521"/>
      </g>
    </g>

    <g id="slot-feet"></g>
    <g id="torso">
      <path id="body" d="M110 275 C86 300 70 338 68 380 C66 425 76 462 97 485 C146 480 228 480 277 485 C298 462 308 425 306 380 C304 338 288 300 264 275 Z" fill="url(#fur)" stroke="#241510" stroke-width="5.5" stroke-linejoin="round"/>

      <!-- Shade cast by the head onto the chest. -->
      <ellipse cx="188" cy="292" rx="125" ry="26" fill="#6E3D1E" opacity="0.28" clip-path="url(#body-clip)"/>

      <path id="belly" d="M187 304 C231 303 259 340 265 382 C272 426 247 458 207 464 C162 470 128 455 116 426 C100 383 120 335 149 315 C160 308 173 304 187 304 Z" fill="url(#cream)"/>

      <!-- Outfit slots: wardrobe items are injected here and move with the part they belong to. -->
      <g id="slot-shirt"></g>
      <g id="slot-bottom"></g>
      <g id="slot-neck"></g>
      <g id="slot-prop-back"></g>

      <!-- Arms are separate filled shapes so the whole limb rotates from the shoulder. -->
      <g id="arm-left">
        <g id="slot-hold-left"></g>
        <path d="M98 312 C80 330 58 360 44 386 C34 404 38 421 54 425 C68 428 80 420 86 406 C94 386 106 362 116 336 C114 326 108 316 98 312 Z" fill="url(#fur)"/>
        <g id="slot-sleeve-left"></g>
        <g fill="none" stroke="#241510" stroke-linecap="round" stroke-linejoin="round">
          <path d="M98 314 C80 330 58 360 44 386 C34 404 38 421 54 425 C68 428 80 420 86 406 C94 386 106 362 114 340" stroke-width="5.5"/>
          <path d="M51 405 C50 413 53 419 57 421 M65 405 C64 413 67 418 71 420" stroke-width="4.5"/>
        </g>
        <g id="slot-arm-cover-left"></g>
      </g>
      <g id="arm-right">
        <g id="slot-hold-right"></g>
        <path d="M276 312 C294 330 316 360 330 386 C340 404 336 421 320 425 C306 428 294 420 288 406 C280 386 268 362 258 336 C260 326 266 316 276 312 Z" fill="url(#fur)"/>
        <g id="slot-sleeve-right"></g>
        <g fill="none" stroke="#241510" stroke-linecap="round" stroke-linejoin="round">
          <path d="M276 314 C294 330 316 360 330 386 C340 404 336 421 320 425 C306 428 294 420 288 406 C280 386 268 362 260 340" stroke-width="5.5"/>
          <path d="M323 405 C324 413 321 419 317 421 M309 405 C310 413 307 418 303 420" stroke-width="4.5"/>
        </g>
        <g id="slot-hold-front-right"></g>
        <g id="slot-arm-cover-right"></g>
      </g>
    </g>

    <g id="head">
      <g id="ear-left">
        <path d="M110 64 C105 44 93 31 76 29 C59 28 42 39 39 59 C34 77 41 92 57 106 L90 105 C105 94 116 79 110 64 Z" fill="url(#ear)" stroke="#241510" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M64 56 C72 45 86 50 93 63 C83 66 77 76 74 87 C61 81 55 68 64 56 Z" fill="#4A2E22"/>
      </g>
      <g id="ear-right">
        <path d="M264 64 C269 44 281 31 298 29 C315 28 332 39 335 59 C340 77 333 92 317 106 L284 105 C269 94 258 79 264 64 Z" fill="url(#ear)" stroke="#241510" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M310 56 C302 45 288 50 281 63 C291 66 297 76 300 87 C313 81 319 68 310 56 Z" fill="#4A2E22"/>
      </g>

      <!-- Wide round head with cheek tufts; the chin edge is left open so it melts into the body. -->
      <path id="head-fill" d="M86 87 C109 47 147 32 188 32 C225 29 260 39 285 57 C315 75 333 116 342 169 C352 174 360 184 362 193 C365 205 353 206 343 200 C355 219 355 232 347 236 C342 238 338 231 335 226 C336 251 315 270 279 282 C256 293 230 296 190 296 C139 296 99 290 77 283 C47 273 34 258 33 230 C26 242 17 239 19 224 C19 217 22 208 30 201 C19 209 11 202 17 191 C22 181 30 177 43 170 C49 133 60 106 86 87 Z" fill="url(#fur)"/>
      <ellipse cx="190" cy="95" rx="110" ry="55" fill="url(#sheen)"/>
      <path id="head-outline" d="M133 289 C111 287 91 284 77 281 C47 272 34 258 33 230 C26 242 17 239 19 224 C19 217 22 208 30 201 C19 209 11 202 17 191 C22 181 30 177 43 170 C49 133 60 106 86 87 C109 47 147 32 188 32 C225 29 260 39 285 57 C315 75 333 116 342 169 C352 174 360 184 362 193 C365 205 353 206 343 200 C355 219 355 232 347 236 C342 238 338 231 335 226 C336 251 315 270 279 282 C268 287 253 290 238 290" fill="none" stroke="#241510" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path id="muzzle" d="M187 180 C166 169 144 176 125 186 C107 194 100 208 100 227 C100 250 118 262 142 266 C156 269 178 268 190 268 C214 269 234 268 250 258 C269 247 274 230 271 213 C267 188 245 177 222 176 C206 175 194 176 187 180 Z" fill="url(#cream)"/>

      <!-- Cheek blush. -->
      <ellipse class="blush" cx="78" cy="238" rx="17" ry="9" fill="#E8826B" opacity="0.35"/>
      <ellipse class="blush" cx="298" cy="238" rx="17" ry="9" fill="#E8826B" opacity="0.35"/>

      <!-- Mouth layers: open laugh cavity under the teeth, the usual teeth + smile, and the surprised "O". -->
      <g id="mouth">
        <g id="mouth-open" opacity="0">
          <path d="M147 234 Q187.5 242 228 234 C232 268 214 290 187.5 290 C161 290 143 268 147 234 Z" fill="#5A231C"/>
          <ellipse cx="187.5" cy="291" rx="34" ry="19" fill="#E8736C" clip-path="url(#mouth-open-clip)"/>
          <path d="M147 234 Q187.5 242 228 234 C232 268 214 290 187.5 290 C161 290 143 268 147 234 Z" fill="none" stroke="#241510" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g id="mouth-teeth">
          <path id="teeth" d="M164 233 H211 L211 257 Q211 268 200 268 H175 Q164 268 164 257 Z" fill="url(#tooth)"/>
          <g fill="none" stroke="#241510" stroke-width="5.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M164 232 L164 257 Q164 267 174 267 L201 267 Q211 267 211 257 L211 232"/>
            <path d="M187.5 224 L187.5 266"/>
            <path id="smile" d="M139 215 C143 236 166 240 187.5 219 C209 240 232 236 236 215"/>
          </g>
        </g>
        <path d="M187.5 204 L187.5 219" fill="none" stroke="#241510" stroke-width="5.3" stroke-linecap="round"/>
        <g id="mouth-o" opacity="0">
          <path d="M187.5 224 C200 224 204 236 204 246 C204 258 197 266 187.5 266 C178 266 171 258 171 246 C171 236 175 224 187.5 224 Z" fill="#5A231C"/>
          <ellipse cx="187.5" cy="264" rx="13" ry="9" fill="#E8736C" clip-path="url(#mouth-o-clip)"/>
          <path d="M187.5 224 C200 224 204 236 204 246 C204 258 197 266 187.5 266 C178 266 171 258 171 246 C171 236 175 224 187.5 224 Z" fill="none" stroke="#241510" stroke-width="5" stroke-linejoin="round"/>
        </g>
      </g>

      <g id="eyes">
        <g class="eye" id="eye-left">
          <g class="eye-open">
            <ellipse cx="110" cy="159" rx="20.5" ry="23" fill="#140C09"/>
            <g class="pupil-glint">
              <ellipse cx="104" cy="150" rx="7" ry="8" fill="#FFFFFF"/>
              <circle cx="117" cy="170" r="3" fill="#FFFFFF" opacity="0.8"/>
            </g>
            <g clip-path="url(#eye-clip-left)">
              <g class="lid" transform="translate(0 -64)">
                <path d="M84 110 H136 V172 Q110 188 84 172 Z" fill="#B5723F"/>
                <path d="M84 172 Q110 188 136 172" fill="none" stroke="#241510" stroke-width="5" stroke-linecap="round"/>
              </g>
            </g>
          </g>
          <path class="eye-arc" d="M88 168 Q110 140 132 168" fill="none" stroke="#241510" stroke-width="8" stroke-linecap="round" opacity="0"/>
        </g>
        <g class="eye" id="eye-right">
          <g class="eye-open">
            <ellipse cx="263" cy="159" rx="20.5" ry="23" fill="#140C09"/>
            <g class="pupil-glint">
              <ellipse cx="257" cy="150" rx="7" ry="8" fill="#FFFFFF"/>
              <circle cx="270" cy="170" r="3" fill="#FFFFFF" opacity="0.8"/>
            </g>
            <g clip-path="url(#eye-clip-right)">
              <g class="lid" transform="translate(0 -64)">
                <path d="M237 110 H289 V172 Q263 188 237 172 Z" fill="#B5723F"/>
                <path d="M237 172 Q263 188 289 172" fill="none" stroke="#241510" stroke-width="5" stroke-linecap="round"/>
              </g>
            </g>
          </g>
          <path class="eye-arc" d="M241 168 Q263 140 285 168" fill="none" stroke="#241510" stroke-width="8" stroke-linecap="round" opacity="0"/>
        </g>
      </g>
      <g id="brows" fill="none" stroke="#241510" stroke-width="8" stroke-linecap="round">
        <path id="brow-left" d="M100 117 Q110 107 122 112"/>
        <path id="brow-right" d="M252 112 Q264 107 274 117"/>
      </g>

      <g id="nose">
        <path d="M151 170 C151 161 169 156 187.5 156 C206 156 224 161 224 170 C221 185 204 199 187.5 204 C171 199 154 185 151 170 Z" fill="url(#nose-grad)" stroke="#241510" stroke-width="5" stroke-linejoin="round"/>
        <ellipse cx="176" cy="166" rx="10" ry="4.5" fill="#FFFFFF" opacity="0.28"/>
      </g>

      <g id="whiskers" fill="none" stroke="#241510" stroke-width="4" stroke-linecap="round">
        <path d="M112 201 Q89 193 66 196"/>
        <path d="M112 215 Q88 215 65 223"/>
        <path d="M263 201 Q286 193 309 196"/>
        <path d="M263 215 Q287 215 310 223"/>
      </g>
      <!-- Emotion effects around the head. -->
      <g id="fx-surprise" opacity="0" fill="none" stroke-linecap="round">
        <path d="M30 122 L4 110 M34 104 L14 84 M46 94 L40 70 M344 122 L370 110 M340 104 L360 84 M328 94 L334 70" stroke="#241510" stroke-width="11"/>
        <path d="M30 122 L4 110 M34 104 L14 84 M46 94 L40 70 M344 122 L370 110 M340 104 L360 84 M328 94 L334 70" stroke="#FFD23F" stroke-width="5.5"/>
      </g>
      <g id="fx-sparkle" opacity="0">
        <path d="M356 64 Q361 86 382 92 Q361 98 356 120 Q351 98 330 92 Q351 86 356 64 Z" fill="#FFD23F" stroke="#241510" stroke-width="4" stroke-linejoin="round"/>
        <path d="M352 80 Q354 88 360 90" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      </g>
      <!-- Обида: знак злости и пар из ушей. Сон: всплывающие Z. Части двигает beaver-rig. -->
      <g id="fx-anger" opacity="0">
        <path d="M-15 -4 Q-4 -4 -4 -15 M4 -15 Q4 -4 15 -4 M15 4 Q4 4 4 15 M-4 15 Q-4 4 -15 4" fill="none" stroke="#241510" stroke-width="11" stroke-linecap="round"/>
        <path d="M-15 -4 Q-4 -4 -4 -15 M4 -15 Q4 -4 15 -4 M15 4 Q4 4 4 15 M-4 15 Q-4 4 -15 4" fill="none" stroke="#E0463B" stroke-width="5.5" stroke-linecap="round"/>
      </g>
      <g id="fx-steam" opacity="0">
        <g class="puff"><circle r="12" fill="#241510"/><circle cx="10" cy="-5" r="10" fill="#241510"/><circle cx="-10" cy="-4" r="10" fill="#241510"/>
          <circle r="8.5" fill="#FFFFFF"/><circle cx="10" cy="-5" r="6.5" fill="#FFFFFF"/><circle cx="-10" cy="-4" r="6.5" fill="#FFFFFF"/></g>
        <g class="puff"><circle r="12" fill="#241510"/><circle cx="10" cy="-5" r="10" fill="#241510"/><circle cx="-10" cy="-4" r="10" fill="#241510"/>
          <circle r="8.5" fill="#FFFFFF"/><circle cx="10" cy="-5" r="6.5" fill="#FFFFFF"/><circle cx="-10" cy="-4" r="6.5" fill="#FFFFFF"/></g>
      </g>
      <g id="fx-zzz" opacity="0">
        <g class="z"><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#241510" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="z"><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#241510" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="z"><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#241510" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -10 H9 L-9 10 H9" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      </g>
      <g id="slot-eyes"></g>
      <g id="slot-hat"></g>
    </g>
    <g id="slot-prop-front"></g>
  </g></g>
</svg>
