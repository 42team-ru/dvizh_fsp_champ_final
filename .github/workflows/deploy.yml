# PR: тесты + сборка. Push в main: то же + образы в GHCR + деплой на VPS (docker compose pull).
# Быстро за счёт: кэша Gradle/Yarn, сборки jar/фронта вне docker (образы тонкие, ~секунды),
# параллельных джоб test и images.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Backend tests (Testcontainers)
        working-directory: backend
        run: ./gradlew check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # jar и фронта (`build/client`) собираем параллельно, прямо на раннере (с кэшем)
      - name: Build jar and dist
        run: |
          (cd backend && ./gradlew bootJar -x test --console=plain) &
          (cd frontend && yarn install --frozen-lockfile && VITE_BACKEND_URL="" yarn build) &
          wait -n && wait -n

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - if: env.DEPLOY == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile.ci
          push: ${{ env.DEPLOY == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}/app:latest
            ${{ steps.meta.outputs.image }}/app:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile.ci
          push: ${{ env.DEPLOY == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}/web:latest
            ${{ steps.meta.outputs.image }}/web:${{ github.sha }}

  deploy:
    needs: [test, images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Deploy
        env:
          DIR: ${{ vars.VPS_DIR || '/opt/app' }}
          IMAGE: ${{ needs.images.outputs.image }}
          TAG: ${{ github.sha }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh vps "mkdir -p $DIR"
          rsync -az deploy/docker-compose.yml "vps:$DIR/"
          # токен живёт только в этой джобе; на VPS он нужен лишь чтобы вытянуть (возможно приватные) образы
          ssh vps "set -e; cd $DIR
            echo '$GH_TOKEN' | docker login ghcr.io -u '$GH_USER' --password-stdin
            grep -q '^JWT_SECRET=' .env || echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
            grep -q '^S3_SECRET_KEY=' .env || echo "S3_SECRET_KEY=$(openssl rand -hex 24)" >> .env
            sed -i '/^IMAGE=/d;/^TAG=/d' .env
            printf 'IMAGE=$IMAGE\nTAG=$TAG\n' >> .env
            docker compose pull app web
            docker compose up -d --wait --wait-timeout 120 --remove-orphans
            docker image prune -f
            docker compose ps"
