# Локальная разработка: БД и S3 (MinIO). Бэк и фронт запускаются из IDE / yarn dev, инфраструктура — `make dev`.
# Порты 5440 и 9440/9441 (а не 5432 и 9000/9001), чтобы не конфликтовать с Postgres и MinIO, которые уже стоят на машине.
services:
  db:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-хранилище файлов (аватарки, фото событий, документы организаций). Бакет создаёт бэкенд при старте.
  # Официальные образы MinIO больше не публикуются (Docker Hub удалён, quay.io закрыт), поэтому берём
  # сборку того же MinIO от Pigsty (pgsty/minio) с закреплённым тегом. Сменить сервер — поменять только образ.
  # Консоль: http://localhost:9441 (app / app-secret-dev)
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret-dev
    ports:
      - "127.0.0.1:9440:9000"
      - "127.0.0.1:9441:9001"
    volumes:
      - minio-dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Нейросеть модерации для make back (с MODERATION_LLM_ENABLED=true): make llm. С make dev не стартует.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11459
    profiles: [llm]
    command: >-
      -hf unsloth/Qwen3.5-0.8B-GGUF:Q4_K_M --no-mmproj --alias qwen3.5-0.8b
      --host 0.0.0.0 --port 8080 --ctx-size 4096 --parallel 1 --threads 4
      --jinja --chat-template-kwargs '{"enable_thinking":false}'
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - llmcache-dev:/root/.cache/llama.cpp

  # Классификатор токсичности rubert-tiny-toxicity (text-embeddings-inference) — третий голос модерации, тоже make llm.
  toxicity:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [llm]
    command: --model-id cointegrated/rubert-tiny-toxicity
    ports:
      - "127.0.0.1:8093:80"
    volumes:
      - toxicity-dev:/data

volumes:
  pgdata-dev:
  llmcache-dev:
  toxicity-dev:
  minio-dev:
