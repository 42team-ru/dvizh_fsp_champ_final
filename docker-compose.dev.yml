# Локальная разработка: только БД. Бэк и фронт запускаются из IDE / yarn dev.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev:
