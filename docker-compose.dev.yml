# Локальная разработка: только БД. Бэк и фронт запускаются из IDE / yarn dev или одной командой `make dev`.
# Порт 5440 (а не 5432), чтобы не конфликтовать с Postgres, который уже стоит на машине.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
