# Быстрый профиль для тестов: H2 в памяти, схема из сущностей (миграции проверяет PostgresMigrationsTest)
spring:
  datasource:
    url: jdbc:h2:mem:app;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  storage:
    type: memory   # файлы в памяти: тестам не нужен MinIO
  economy:
    scheduler-enabled: false   # фоновые начисления тестам не нужны
  notifications:
    scheduling-enabled: false   # доставку и напоминания тесты запускают вручную
  moderation:
    scheduling-enabled: false   # подметальщик проверок тестам не нужен
  demo:
    enabled: false   # демо-сид (сотни строк) тестам не нужен и не покрывается тестами
