spring:
  application:
    name: app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Точные лимиты по типу файла (фото 5 МБ, документы 10 МБ) проверяет FileService
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    # В проде задаётся через JWT_SECRET (минимум 32 символа). Дефолт — только для локальной разработки.
    jwt-secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only}
    access-ttl: 15m
    refresh-ttl: 14d
  demo:
    # DEMO_MODE=true: тестовые аккаунты и мероприятия (DemoSeeder) и быстрый вход без пароля. Только для демо/жюри!
    enabled: ${DEMO_MODE:true}
    password: ${DEMO_PASSWORD:demo-password-1}
  storage:
    # s3 — MinIO или любой S3 (make dev поднимает MinIO на :9440); memory — в памяти процесса, для тестов
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9440}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:app}
    secret-key: ${S3_SECRET_KEY:app-secret-dev}
    bucket: ${S3_BUCKET:app-files}
  pet-import:
    # Python с vtracer, pillow и svgelements для импорта вещей бобра (src/main/resources/pet-import/requirements.txt).
    # В Docker-образе — venv /opt/pet-import; на Windows обычно просто python.
    python: ${PET_IMPORT_PYTHON:python3}
    timeout: 30s
  notifications:
    # Адрес сайта для ссылок в уведомлениях (Telegram открывает /events/{id})
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
    # Пояс разовых событий в тексте уведомлений; серии используют свой пояс
    time-zone: ${NOTIFICATIONS_TIME_ZONE:Asia/Krasnoyarsk}
    scheduling-enabled: ${NOTIFICATIONS_SCHEDULING_ENABLED:true}
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      token: ${TELEGRAM_BOT_TOKEN:}
      username: ${TELEGRAM_BOT_USERNAME:}
      webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  recommendations:
    # Подбор мероприятий и клубов; формулы и смысл весов — docs/recommendations.md
    half-life-days: 45      # история вдвое «легче» через столько дней
    horizon-days: 30        # насколько вперёд подбираем
    discovery-every: 5      # каждая 5-я позиция — «Попробуйте новое»
    mmr-lambda: 0.75        # 1 — только оценка, меньше — разнообразнее
    weights:
      sport: 0.30
      distance: 0.15
      level: 0.12
      time: 0.12
      social: 0.08
      organizer: 0.08
      trust: 0.05
      popularity: 0.04
      quorum: 0.03
      urgency: 0.03
    scoring:                  # константы формулы оценки (EventScorer)
      reason-threshold: 0.03  # причина на карточке, если её признак дал хотя бы столько оценки
      max-reasons: 3          # сколько причин показывать
      related-sport-share: 0.6       # доля интереса от похожего вида спорта
      related-organizer-share: 0.5   # доля лояльности от похожего организатора
      online-distance-value: 0.6     # «расстояние» онлайн-встречи: не рядом, но и не далеко
      level-gate: 0.3         # множитель, если уровень совсем не подходит
      min-habit: 3            # привычки по времени — со стольких посещений
    dismiss:                  # «Не интересно»: скрытое уходит, похожие опускаются, но не пропадают
      sport-factor: 0.5       # «Не мой вид спорта»: множитель за каждое скрытие вида
      similar-strength: 0.6   # сила штрафа похожим: множитель 1 − strength · похожесть · свежесть
      floor: 0.35             # ниже не опускаем: похожие встречи остаются в подборке
      min-similarity: 0.3     # слабее похожие не штрафуем
      near-km: 3              # «то же место», км
      similarity:             # из чего похожесть (нормируется на сумму)
        sport: 0.45
        organizer: 0.25
        time: 0.15
        place: 0.15
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
