spring:
  application:
    name: app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Точные лимиты по типу файла (фото 5 МБ, документы 10 МБ) проверяет FileService
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    # В проде задаётся через JWT_SECRET (минимум 32 символа). Дефолт — только для локальной разработки.
    jwt-secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only}
    access-ttl: 15m
    refresh-ttl: 14d
  demo:
    # DEMO_MODE=true: тестовые аккаунты и мероприятия (DemoSeeder) и быстрый вход без пароля. Только для демо/жюри!
    enabled: ${DEMO_MODE:true}
    password: ${DEMO_PASSWORD:demo-password-1}
  storage:
    # s3 — MinIO или любой S3 (make dev поднимает MinIO на :9440); memory — в памяти процесса, для тестов
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9440}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:app}
    secret-key: ${S3_SECRET_KEY:app-secret-dev}
    bucket: ${S3_BUCKET:app-files}
  pet-import:
    # Python с vtracer, pillow и svgelements для импорта вещей бобра (src/main/resources/pet-import/requirements.txt).
    # В Docker-образе — venv /opt/pet-import; на Windows обычно просто python.
    python: ${PET_IMPORT_PYTHON:python3}
    timeout: 30s
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
