# Запуск всего проекта одной командой (для жюри / демо):
#   docker compose up --build        ->  http://localhost:8080
# Ничего ставить не нужно, кроме Docker. Всё собирается из исходников.
# Тот же файл годится для ручного деплоя на сервер через git clone (docs/dev-faq.md): настройки через .env рядом с файлом
# или переменные окружения: PORT, HTTPS_PORT, DOMAIN, DB_PASSWORD, JWT_SECRET, DEMO_MODE, CORS_ORIGINS.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-app}
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-demo-only-secret-demo}
      # Демо-режим для жюри: CORS открыт для любого origin. В проде (deploy/) остаётся строгий список.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Демо-режим: тестовые аккаунты admin / ivan / maria (пароль demo-password-1); кнопки на странице входа подставляют их в форму
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}   # домен -> автоматический HTTPS (нужны PORT=80 и HTTPS_PORT=443)
    ports:
      - "${PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./data/caddy:/data     # сертификаты Let's Encrypt переживают пересоздание контейнеров
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
