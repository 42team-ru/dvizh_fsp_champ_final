# Запуск всего проекта одной командой (для жюри / демо):
#   docker compose up --build        ->  http://localhost:8080
# Ничего ставить не нужно, кроме Docker. Всё собирается из исходников.
# Тот же файл годится для ручного деплоя на сервер через git clone (docs/dev-faq.md): настройки через .env рядом с файлом
# или переменные окружения: PORT, HTTPS_PORT, DOMAIN, DB_PASSWORD, JWT_SECRET, S3_SECRET_KEY, DEMO_MODE, CORS_ORIGINS.
services:
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-хранилище файлов. Наружу не публикуется: файлы отдаёт бэкенд через /api/files/{id}.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-demo-only-s3-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-app}
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-demo-only-secret-demo}
      # Демо-режим для жюри: CORS открыт для любого origin. В проде (deploy/) остаётся строгий список.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Демо-режим: тестовые аккаунты admin / anna / petr / olga / ladya / enisey (пароль demo-password-1); кнопки на странице входа подставляют их в форму
      DEMO_MODE: ${DEMO_MODE:-true}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: app
      S3_SECRET_KEY: ${S3_SECRET_KEY:-demo-only-s3-secret}
      # Уведомления в Telegram (docs/notifications.md); по умолчанию выключены
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Маршруты 2ГИС для подсказки «когда выходить» (тот же ключ, что у карты)
      VITE_2GIS_KEY: ${VITE_2GIS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:   # ключ карты 2ГИС из корневого .env; без него карта не загрузится, остальное работает
        VITE_2GIS_KEY: ${VITE_2GIS_KEY:-}
        VITE_2GIS_STYLE_ID: ${VITE_2GIS_STYLE_ID:-}
        VITE_2GIS_MAP: ${VITE_2GIS_MAP:-raster}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}   # домен -> автоматический HTTPS (нужны PORT=80 и HTTPS_PORT=443)
    ports:
      - "${PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./data/caddy:/data     # сертификаты Let's Encrypt переживают пересоздание контейнеров
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
