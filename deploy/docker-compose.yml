# Прод на VPS. Ничего не собирается на сервере: образы приходят из GHCR (pull качает только изменившиеся слои).
# IMAGE (ghcr.io/owner/repo) и TAG выставляет CI в /opt/app/.env при каждом деплое.
services:
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-хранилище файлов. Порты не публикуются: файлы отдаёт бэкенд через /api/files/{id}.
  # Данные — обычная папка /opt/app/data/minio (как сертификаты Caddy): переживает `down -v` и `volume prune`.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${IMAGE}/app:${TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Демо-режим (тестовые аккаунты с публичным паролем): включить DEMO_MODE=true в /opt/app/.env, если сервер используется как демо
      DEMO_MODE: ${DEMO_MODE:-false}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: app
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    image: ${IMAGE}/web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      # Сертификаты Let's Encrypt — обычная папка на диске VPS (/opt/app/data/caddy), а не docker volume:
      # переживает `down -v`, `volume prune`, пересоздание контейнеров. Иначе упрёмся в лимиты Let's Encrypt.
      - ./data/caddy:/data
    depends_on:
      - app

volumes:
  pgdata:
